name: trace-guard

# Extracted from pr.yml so it can be path-scoped. It runs a full production build of
# @idcr/admin and verifies @vercel/nft traces Playwright/Chromium assets into the
# scheduled sermon-PDF worker function (`/api/content/pdf-worker`, moved from @idcr/web
# in ICR-205).
#
# Scope = anything that can change what @vercel/nft traces into the sermon-PDF cron
# function: the admin app itself (incl. next.config.ts and the route), workspace
# packages, and the dependency graph (playwright-core's version decides where
# browsers.json lives).
on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/trace-guard.yml"

permissions:
  contents: read

jobs:
  trace-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @idcr/admin
        run: pnpm --filter @idcr/admin build

      - name: Verify the admin PDF worker traces browsers.json and chromium.br
        run: pnpm --filter @idcr/admin verify:trace
