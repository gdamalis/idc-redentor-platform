<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio de sesión — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <div class="center-viewport">
        <div class="card" style="max-width: 400px; width: 100%">
          <div class="card-body">
            <div class="brand" style="justify-content: center; padding: 4px 0 4px">
              <div class="mark">R</div>
              <div>
                <div class="brand-name">IDC Redentor</div>
                <div class="brand-sub">Panel Ministerial</div>
              </div>
            </div>

            <div style="text-align: center; margin: 22px 0 24px">
              <h1 style="font-size: 22px">Iniciá sesión</h1>
              <p class="muted" style="margin: 6px 0 0; font-size: 13px">
                Acceso solo por invitación.
              </p>
            </div>

            <button
              class="btn btn-md btn-outline"
              style="width: 100%; justify-content: center"
            >
              Continuar con Google
            </button>

            <div class="divider">o</div>

            <div class="field">
              <label class="field-label">Correo electrónico</label>
              <input class="input" placeholder="nombre@idcredentor.com" />
            </div>
            <div class="field">
              <label class="field-label">Contraseña</label>
              <input class="input" type="password" />
            </div>

            <div style="text-align: right; margin-bottom: 20px">
              <a class="btn btn-ghost btn-sm" href="#" style="padding: 0"
                >¿Olvidaste tu contraseña?</a
              >
            </div>

            <button
              class="btn btn-md btn-primary"
              style="width: 100%; justify-content: center"
            >
              Iniciar sesión
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <div class="center-viewport">
        <div class="card" style="max-width: 400px; width: 100%">
          <div class="card-body">
            <div class="brand" style="justify-content: center; padding: 4px 0 4px">
              <div class="mark">R</div>
              <div>
                <div class="brand-name">IDC Redentor</div>
                <div class="brand-sub">Panel Ministerial</div>
              </div>
            </div>

            <div style="text-align: center; margin: 22px 0 24px">
              <h1 style="font-size: 22px">Iniciá sesión</h1>
              <p class="muted" style="margin: 6px 0 0; font-size: 13px">
                Acceso solo por invitación.
              </p>
            </div>

            <button
              class="btn btn-md btn-outline"
              style="width: 100%; justify-content: center"
            >
              Continuar con Google
            </button>

            <div class="divider">o</div>

            <div class="field">
              <label class="field-label">Correo electrónico</label>
              <input class="input" placeholder="nombre@idcredentor.com" />
            </div>
            <div class="field">
              <label class="field-label">Contraseña</label>
              <input class="input" type="password" />
            </div>

            <div style="text-align: right; margin-bottom: 20px">
              <a class="btn btn-ghost btn-sm" href="#" style="padding: 0"
                >¿Olvidaste tu contraseña?</a
              >
            </div>

            <button
              class="btn btn-md btn-primary"
              style="width: 100%; justify-content: center"
            >
              Iniciar sesión
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
