<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkbox — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Checkbox</h2>
        <div class="ds-grid" style="flex-direction: column; align-items: flex-start; gap: 4px">
          <label class="checkbox">
            <input type="checkbox" />
            Puede ver datos sensibles
          </label>
          <label class="checkbox">
            <input type="checkbox" checked />
            Puede ver datos sensibles
          </label>
          <label class="checkbox">
            <input type="checkbox" data-indeterminate />
            Puede ver datos sensibles
          </label>
          <label class="checkbox is-disabled">
            <input type="checkbox" disabled />
            Puede ver datos sensibles
          </label>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Checkbox</h2>
        <div class="ds-grid" style="flex-direction: column; align-items: flex-start; gap: 4px">
          <label class="checkbox">
            <input type="checkbox" />
            Puede ver datos sensibles
          </label>
          <label class="checkbox">
            <input type="checkbox" checked />
            Puede ver datos sensibles
          </label>
          <label class="checkbox">
            <input type="checkbox" data-indeterminate />
            Puede ver datos sensibles
          </label>
          <label class="checkbox is-disabled">
            <input type="checkbox" disabled />
            Puede ver datos sensibles
          </label>
        </div>
      </section>
    </div>

    <script>
      // A native checkbox's indeterminate state has no HTML attribute — it is
      // an IDL property only reachable via script. This is the one artifact
      // in the system that needs it, kept minimal and non-interactive.
      document.querySelectorAll("[data-indeterminate]").forEach((el) => {
        el.indeterminate = true;
      });
    </script>
  </body>
</html>
