<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SegmentedToggle — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>SegmentedToggle</h2>
        <div class="ds-grid" style="align-items: center">
          <div>
            <div class="seg" title="Idioma / Language">
              <button class="on">ES</button>
              <button>EN</button>
            </div>
            <div class="val" style="margin-top: 6px">Idioma</div>
          </div>
          <div>
            <div class="seg">
              <button class="on">Claro</button>
              <button>Oscuro</button>
            </div>
            <div class="val" style="margin-top: 6px">Tema</div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>SegmentedToggle</h2>
        <div class="ds-grid" style="align-items: center">
          <div>
            <div class="seg" title="Idioma / Language">
              <button class="on">ES</button>
              <button>EN</button>
            </div>
            <div class="val" style="margin-top: 6px">Idioma</div>
          </div>
          <div>
            <div class="seg">
              <button class="on">Claro</button>
              <button>Oscuro</button>
            </div>
            <div class="val" style="margin-top: 6px">Tema</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
