<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Input</h2>
        <div class="ds-grid" style="align-items: flex-start">
          <div class="field" style="width: 260px">
            <div class="ds-label" style="margin-bottom: 0">Default</div>
            <input class="input" placeholder="Buscar por nombre, familia o teléfono…" />
          </div>

          <div class="field" style="width: 260px">
            <div class="ds-label" style="margin-bottom: 0">Focused</div>
            <input class="input is-focus" placeholder="Buscar por nombre, familia o teléfono…" />
          </div>

          <div class="field has-error" style="width: 260px">
            <label class="field-label">Correo electrónico</label>
            <input class="input" value="servando@idcredentor" />
            <div class="field-error">Ingresá un correo válido</div>
          </div>

          <div class="field" style="width: 260px">
            <div class="ds-label" style="margin-bottom: 0">Disabled</div>
            <input class="input" placeholder="Buscar por nombre, familia o teléfono…" disabled />
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Nombre completo</label>
            <input class="input" value="Servando Peña" />
            <div class="field-help">Como aparece en los registros de la iglesia</div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Input</h2>
        <div class="ds-grid" style="align-items: flex-start">
          <div class="field" style="width: 260px">
            <div class="ds-label" style="margin-bottom: 0">Default</div>
            <input class="input" placeholder="Buscar por nombre, familia o teléfono…" />
          </div>

          <div class="field" style="width: 260px">
            <div class="ds-label" style="margin-bottom: 0">Focused</div>
            <input class="input is-focus" placeholder="Buscar por nombre, familia o teléfono…" />
          </div>

          <div class="field has-error" style="width: 260px">
            <label class="field-label">Correo electrónico</label>
            <input class="input" value="servando@idcredentor" />
            <div class="field-error">Ingresá un correo válido</div>
          </div>

          <div class="field" style="width: 260px">
            <div class="ds-label" style="margin-bottom: 0">Disabled</div>
            <input class="input" placeholder="Buscar por nombre, familia o teléfono…" disabled />
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Nombre completo</label>
            <input class="input" value="Servando Peña" />
            <div class="field-help">Como aparece en los registros de la iglesia</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
