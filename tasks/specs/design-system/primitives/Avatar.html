<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Avatar</h2>
        <div class="ds-label">Tamaños</div>
        <div class="ds-grid" style="align-items: center">
          <div>
            <span class="avatar avatar-sm">GD</span>
            <div class="val" style="margin-top: 6px">28px</div>
          </div>
          <div>
            <span class="avatar">GD</span>
            <div class="val" style="margin-top: 6px">32px</div>
          </div>
          <div>
            <span class="avatar avatar-lg">GD</span>
            <div class="val" style="margin-top: 6px">44px</div>
          </div>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Iniciales</div>
        <div class="ds-grid">
          <span class="avatar">GD</span>
          <span class="avatar">SP</span>
          <span class="avatar">NV</span>
          <span class="avatar">MR</span>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Con foto y favorito</div>
        <div class="ds-grid" style="align-items: center">
          <div>
            <span class="avatar avatar-lg avatar-photo" role="img" aria-label="Foto de perfil">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8.5" r="3.4" />
                <path d="M4.5 20c1.4-4.3 4.1-6.4 7.5-6.4s6.1 2.1 7.5 6.4" />
              </svg>
            </span>
            <div class="val" style="margin-top: 6px">Marcador de foto (sin fotos reales aún)</div>
          </div>
          <div>
            <span class="avatar-wrap">
              <span class="avatar avatar-lg">SP</span>
              <span class="avatar-star">
                <svg class="star" viewBox="0 0 24 24">
                  <path
                    d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L6 21l1.6-7L2.2 9.2l7.1-.6z"
                  />
                </svg>
              </span>
            </span>
            <div class="val" style="margin-top: 6px">Marcador de favorito</div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Avatar</h2>
        <div class="ds-label">Tamaños</div>
        <div class="ds-grid" style="align-items: center">
          <div>
            <span class="avatar avatar-sm">GD</span>
            <div class="val" style="margin-top: 6px">28px</div>
          </div>
          <div>
            <span class="avatar">GD</span>
            <div class="val" style="margin-top: 6px">32px</div>
          </div>
          <div>
            <span class="avatar avatar-lg">GD</span>
            <div class="val" style="margin-top: 6px">44px</div>
          </div>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Iniciales</div>
        <div class="ds-grid">
          <span class="avatar">GD</span>
          <span class="avatar">SP</span>
          <span class="avatar">NV</span>
          <span class="avatar">MR</span>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Con foto y favorito</div>
        <div class="ds-grid" style="align-items: center">
          <div>
            <span class="avatar avatar-lg avatar-photo" role="img" aria-label="Foto de perfil">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8.5" r="3.4" />
                <path d="M4.5 20c1.4-4.3 4.1-6.4 7.5-6.4s6.1 2.1 7.5 6.4" />
              </svg>
            </span>
            <div class="val" style="margin-top: 6px">Marcador de foto (sin fotos reales aún)</div>
          </div>
          <div>
            <span class="avatar-wrap">
              <span class="avatar avatar-lg">SP</span>
              <span class="avatar-star">
                <svg class="star" viewBox="0 0 24 24">
                  <path
                    d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L6 21l1.6-7L2.2 9.2l7.1-.6z"
                  />
                </svg>
              </span>
            </span>
            <div class="val" style="margin-top: 6px">Marcador de favorito</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
