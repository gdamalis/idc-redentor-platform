<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropdownMenu — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section" style="padding-bottom: 120px">
        <h2>DropdownMenu</h2>
        <div class="ds-label">Estado abierto, anclado bajo el disparador .kebab</div>
        <div class="menu-anchor">
          <button class="kebab" aria-label="Más acciones">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
              <circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle
                cx="12"
                cy="19"
                r="1.4"
              />
            </svg>
          </button>
          <div class="menu">
            <div class="menu-item">Ver detalles</div>
            <div class="menu-item">Editar</div>
            <div class="menu-item">Gestionar familia</div>
            <div class="menu-sep"></div>
            <div class="menu-item destructive">Eliminar</div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section" style="padding-bottom: 120px">
        <h2>DropdownMenu</h2>
        <div class="ds-label">Estado abierto, anclado bajo el disparador .kebab</div>
        <div class="menu-anchor">
          <button class="kebab" aria-label="Más acciones">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
              <circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle
                cx="12"
                cy="19"
                r="1.4"
              />
            </svg>
          </button>
          <div class="menu">
            <div class="menu-item">Ver detalles</div>
            <div class="menu-item">Editar</div>
            <div class="menu-item">Gestionar familia</div>
            <div class="menu-sep"></div>
            <div class="menu-item destructive">Eliminar</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
