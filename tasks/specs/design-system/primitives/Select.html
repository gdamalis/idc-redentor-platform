<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Select</h2>
        <div class="ds-grid" style="align-items: flex-start">
          <div class="field" style="width: 260px">
            <label class="field-label">Grupo familiar</label>
            <select class="select">
              <option>Familia Peña</option>
              <option>Familia Vargas</option>
              <option>Familia Rodríguez</option>
              <option>Sin familia</option>
            </select>
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Grupo familiar</label>
            <select class="select" disabled>
              <option>Familia Peña</option>
              <option>Familia Vargas</option>
              <option>Familia Rodríguez</option>
              <option>Sin familia</option>
            </select>
            <div class="field-help">Disabled</div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Select</h2>
        <div class="ds-grid" style="align-items: flex-start">
          <div class="field" style="width: 260px">
            <label class="field-label">Grupo familiar</label>
            <select class="select">
              <option>Familia Peña</option>
              <option>Familia Vargas</option>
              <option>Familia Rodríguez</option>
              <option>Sin familia</option>
            </select>
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Grupo familiar</label>
            <select class="select" disabled>
              <option>Familia Peña</option>
              <option>Familia Vargas</option>
              <option>Familia Rodríguez</option>
              <option>Sin familia</option>
            </select>
            <div class="field-help">Disabled</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
