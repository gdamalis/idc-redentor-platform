<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Button</h2>
        <div class="ds-label">Variantes</div>
        <div class="ds-grid">
          <button class="btn btn-md btn-primary">Guardar cambios</button>
          <button class="btn btn-md btn-outline">Cancelar</button>
          <button class="btn btn-md btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Nueva persona
          </button>
          <button class="btn btn-md btn-secondary">Invitar usuario</button>
          <button class="btn btn-md btn-destructive">Eliminar</button>
          <button class="btn btn-md btn-ghost">Ver detalles</button>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Tamaños</div>
        <div class="ds-grid" style="align-items: center">
          <div>
            <button class="btn btn-sm btn-primary">Guardar cambios</button>
            <div class="val" style="margin-top: 6px">sm — 36px visual / 44px hit</div>
          </div>
          <div>
            <button class="btn btn-md btn-primary">Guardar cambios</button>
            <div class="val" style="margin-top: 6px">md — 44px</div>
          </div>
          <div>
            <button class="btn btn-lg btn-primary">Guardar cambios</button>
            <div class="val" style="margin-top: 6px">lg — 48px</div>
          </div>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Solo ícono y deshabilitado</div>
        <div class="ds-grid">
          <button class="btn btn-md btn-outline btn-icon" aria-label="Agregar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button class="btn btn-md btn-primary" disabled>Guardar cambios</button>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Button</h2>
        <div class="ds-label">Variantes</div>
        <div class="ds-grid">
          <button class="btn btn-md btn-primary">Guardar cambios</button>
          <button class="btn btn-md btn-outline">Cancelar</button>
          <button class="btn btn-md btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Nueva persona
          </button>
          <button class="btn btn-md btn-secondary">Invitar usuario</button>
          <button class="btn btn-md btn-destructive">Eliminar</button>
          <button class="btn btn-md btn-ghost">Ver detalles</button>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Tamaños</div>
        <div class="ds-grid" style="align-items: center">
          <div>
            <button class="btn btn-sm btn-primary">Guardar cambios</button>
            <div class="val" style="margin-top: 6px">sm — 36px visual / 44px hit</div>
          </div>
          <div>
            <button class="btn btn-md btn-primary">Guardar cambios</button>
            <div class="val" style="margin-top: 6px">md — 44px</div>
          </div>
          <div>
            <button class="btn btn-lg btn-primary">Guardar cambios</button>
            <div class="val" style="margin-top: 6px">lg — 48px</div>
          </div>
        </div>
      </section>

      <section class="ds-section">
        <div class="ds-label">Solo ícono y deshabilitado</div>
        <div class="ds-grid">
          <button class="btn btn-md btn-outline btn-icon" aria-label="Agregar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button class="btn btn-md btn-primary" disabled>Guardar cambios</button>
        </div>
      </section>
    </div>
  </body>
</html>
