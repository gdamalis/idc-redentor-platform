<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagination — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Pagination</h2>

        <div class="ds-label">Conjunto real (52 personas)</div>
        <div class="card" style="margin-bottom: 20px">
          <div class="table-foot">
            <span>Mostrando 1–8 de 52 personas</span>
            <div class="pager">
              <button>‹</button>
              <button class="on">1</button>
              <button>2</button>
              <button>3</button>
              <button>4</button>
              <button>5</button>
              <button>6</button>
              <button>7</button>
              <button>›</button>
            </div>
          </div>
        </div>

        <div class="ds-label">Conjunto grande (truncado)</div>
        <div class="card">
          <div class="table-foot">
            <span>Mostrando 81–88 de 190 registros</span>
            <div class="pager">
              <button>‹</button>
              <button>…</button>
              <button>10</button>
              <button class="on">11</button>
              <button>12</button>
              <button>…</button>
              <button>24</button>
              <button>›</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Pagination</h2>

        <div class="ds-label">Conjunto real (52 personas)</div>
        <div class="card" style="margin-bottom: 20px">
          <div class="table-foot">
            <span>Mostrando 1–8 de 52 personas</span>
            <div class="pager">
              <button>‹</button>
              <button class="on">1</button>
              <button>2</button>
              <button>3</button>
              <button>4</button>
              <button>5</button>
              <button>6</button>
              <button>7</button>
              <button>›</button>
            </div>
          </div>
        </div>

        <div class="ds-label">Conjunto grande (truncado)</div>
        <div class="card">
          <div class="table-foot">
            <span>Mostrando 81–88 de 190 registros</span>
            <div class="pager">
              <button>‹</button>
              <button>…</button>
              <button>10</button>
              <button class="on">11</button>
              <button>12</button>
              <button>…</button>
              <button>24</button>
              <button>›</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
