<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagination — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Pagination</h2>
        <div class="card">
          <div class="table-foot">
            <span>Mostrando 1–8 de 52 personas</span>
            <div class="pager">
              <button>‹</button>
              <button class="on">1</button>
              <button>2</button>
              <button>3</button>
              <button>…</button>
              <button>16</button>
              <button>›</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Pagination</h2>
        <div class="card">
          <div class="table-foot">
            <span>Mostrando 1–8 de 52 personas</span>
            <div class="pager">
              <button>‹</button>
              <button class="on">1</button>
              <button>2</button>
              <button>3</button>
              <button>…</button>
              <button>16</button>
              <button>›</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
