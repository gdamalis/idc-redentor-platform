<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabs — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Tabs</h2>
        <div class="ds-label">Activa, hover forzado y deshabilitada</div>
        <div class="tabs">
          <div class="tab on">Datos</div>
          <div class="tab is-hover">Familia</div>
          <div class="tab">Áreas</div>
          <div class="tab disabled">Notas</div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Tabs</h2>
        <div class="ds-label">Activa, hover forzado y deshabilitada</div>
        <div class="tabs">
          <div class="tab on">Datos</div>
          <div class="tab is-hover">Familia</div>
          <div class="tab">Áreas</div>
          <div class="tab disabled">Notas</div>
        </div>
      </section>
    </div>
  </body>
</html>
