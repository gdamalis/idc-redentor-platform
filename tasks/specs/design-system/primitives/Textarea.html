<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Textarea — Sistema de Diseño IDC Redentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="preview">
      <!-- LIGHT -->

      <section class="ds-section">
        <h2>Textarea</h2>
        <div class="ds-grid" style="align-items: flex-start">
          <div class="field" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea" rows="4" placeholder="Escribí una nota…"></textarea>
            <div class="field-help">Default</div>
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea is-focus" rows="4">Servando pidió acompañamiento pastoral.</textarea>
            <div class="field-help">Focused</div>
          </div>

          <div class="field has-error" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea" rows="4"></textarea>
            <div class="field-error">Este campo es obligatorio</div>
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea" rows="4" placeholder="Escribí una nota…" disabled></textarea>
            <div class="field-help">Disabled</div>
          </div>
        </div>
      </section>
    </div>

    <div class="preview dark">
      <!-- DARK: the SAME content duplicated -->

      <section class="ds-section">
        <h2>Textarea</h2>
        <div class="ds-grid" style="align-items: flex-start">
          <div class="field" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea" rows="4" placeholder="Escribí una nota…"></textarea>
            <div class="field-help">Default</div>
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea is-focus" rows="4">Servando pidió acompañamiento pastoral.</textarea>
            <div class="field-help">Focused</div>
          </div>

          <div class="field has-error" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea" rows="4"></textarea>
            <div class="field-error">Este campo es obligatorio</div>
          </div>

          <div class="field" style="width: 260px">
            <label class="field-label">Notas</label>
            <textarea class="textarea" rows="4" placeholder="Escribí una nota…" disabled></textarea>
            <div class="field-help">Disabled</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
